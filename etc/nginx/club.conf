# Пример конфига nginx. Замените club.example.com на свой домен и пути к сертификатам.
limit_req_zone $binary_remote_addr zone=club_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /home/club/certs/pubkey.pem;
    ssl_certificate_key /home/club/certs/privkey.pem;

    server_name www.club.example.com;
    rewrite ^(.*) https://club.example.com$1 permanent;
}

server {
    listen 80;
    listen [::]:80;
    server_name club.example.com email.club.example.com admin.club.example.com ru.club.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name club.example.com new.club.example.com ru.club.example.com;

    charset utf-8;
    client_max_body_size 30M;
    index index.html index.htm;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    rewrite ^/favicon.ico$ https://club.example.com/static/images/favicon/favicon.ico;
    rewrite ^/favicon.png$ https://club.example.com/static/images/favicon/favicon-32x32.png;

    ssl_certificate /home/club/certs/pubkey.pem;
    ssl_certificate_key /home/club/certs/privkey.pem;

    location /static/ {
        root /home/club/app/frontend/;
        gzip_static on;
        expires     max;
        add_header Cache-Control "public";
    }

    location /media/ {
        root /home/club/app/;
        expires     max;
        add_header Cache-Control "public";
    }

    location /downloads/ {
        root /home/club/app/gdpr/;
        gzip_static off;
        expires     max;
        add_header Cache-Control "public";
    }

    location /telegram/webhook/ {
        proxy_set_header "Host" $http_host;
        proxy_set_header "X-Forwarded-For" $proxy_add_x_forwarded_for;
        proxy_set_header "X-Forwarded-Proto" $scheme;
        proxy_redirect off;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:8816/;
    }

    location /telegram/helpdeskbot/webhook/ {
        proxy_set_header "Host" $http_host;
        proxy_set_header "X-Forwarded-For" $proxy_add_x_forwarded_for;
        proxy_set_header "X-Forwarded-Proto" $scheme;
        proxy_redirect off;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:8817/;
    }

    location / {
        limit_req zone=club_limit burst=50 nodelay;

        add_header "Access-Control-Allow-Origin" "*";
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS";
        add_header "Access-Control-Allow-Headers" "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        add_header "Access-Control-Expose-Headers" "Content-Length,Content-Range";
        add_header "Strict-Transport-Security" "max-age=31536000;includeSubDomains";
        add_header "X-Content-Type-Options" "nosniff";
        add_header "Referrer-Policy" "strict-origin-when-cross-origin";
        add_header "Permissions-Policy" "accelerometer=(),camera=(),geolocation=(self 'https://club.example.com'),gyroscope=(),magnetometer=(),microphone=(),payment=(),usb=()";

        gzip on;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

        proxy_set_header "Host" $http_host;
        proxy_set_header "X-Forwarded-For" $proxy_add_x_forwarded_for;
        proxy_set_header "X-Forwarded-Proto" $scheme;
        proxy_redirect off;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;

        proxy_pass http://127.0.0.1:8814;
    }
}
