# Запуск в GitHub Codespaces (там внутренняя сеть Docker между контейнерами не работает).
# Все контейнеры работают в общей сети codespace, плюс запускается Telegram-бот клуба.
# Перед запуском: cp .env.example .env и заполнить TELEGRAM_TOKEN, TELEGRAM_BOT_URL, TELEGRAM_ADMIN_CHAT_ID.
#
#   docker compose -f docker-compose.yml -f docker-compose.codespaces.yml up
#
# На сервере этот файл не нужен.

x-hostnet: &hostnet
  network_mode: host
  extra_hosts: ["postgres:127.0.0.1", "redis:127.0.0.1"]

services:
  club_app:
    <<: *hostnet
    ports: !reset []
  queue: *hostnet
  postgres: *hostnet
  redis: *hostnet
  webpack: *hostnet
  bot:
    <<: *hostnet
    image: gezellig-club_app
    pull_policy: never
    command: make docker-run-bot
    environment:
      - MODE=dev
      - DEBUG=true
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=hezellikh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - REDIS_DB=0
      - REDIS_HOST=redis
    volumes:
      - .:/app
    restart: always
    depends_on:
      - club_app
