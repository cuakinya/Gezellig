{% load packages %}
{% club_packages as packages %}
<div class="pay-packages">
    {% for package in packages %}
        <div>
            <input type="radio" id="package-{{ package.code }}" name="product_code" value="{{ package.code }}"{% if package.is_default %} checked{% endif %}>
            <label for="package-{{ package.code }}" class="block pay-package">
                <div class="pay-package-name">{{ package.title }}</div>
                <div class="pay-package-price">{{ package.price }}&nbsp;₽</div>
            </label>
        </div>
    {% endfor %}
</div>

<div class="block-description block-description-center">
    Разовая оплата через ЮKassa, без автопродления. Новые дни прибавляются к текущему сроку.
</div>
